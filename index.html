<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Joy Rummy • Channel Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #E8F3EF;
            font-family: 'Inter', -apple-system, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        /* ----- MAIN CARD (ELEGANT WHITE/GREEN) ----- */
        .verification-card {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 42px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Header profile */
        .profile-header {
            padding: 20px 24px 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #E9F0EC;
            background: #FFFFFF;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            background: #E6F7EF;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.08);
        }

        .avatar svg {
            width: 28px;
            height: 28px;
            stroke: #0A6E4B;
            stroke-width: 1.7;
        }

        .user-info h3 {
            font-size: 17px;
            font-weight: 700;
            color: #1C2E25;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .user-info p {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: #7C8F87;
            font-weight: 500;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            background: #EFFAF5;
            color: #0F6E4A;
            letter-spacing: 0.3px;
        }

        /* content container */
        .content {
            padding: 24px 24px 32px 24px;
        }

        /* scanning state (clean minimal) */
        .scan-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .pulse-ring {
            width: 96px;
            height: 96px;
            background: #E9F6EF;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }

        .pulse-ring:before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 70px;
            background: #32D583;
            opacity: 0.12;
            animation: softPulse 1.8s infinite;
        }

        @keyframes softPulse {
            0% { transform: scale(0.92); opacity: 0.2; }
            70% { transform: scale(1.12); opacity: 0; }
            100% { transform: scale(0.92); opacity: 0.2; }
        }

        .scan-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #C4E6D7;
            border-top-color: #1B8C5E;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .scan-title {
            font-size: 24px;
            font-weight: 800;
            color: #1F3B30;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .scan-desc {
            font-size: 14px;
            color: #7F948B;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .progress-area {
            width: 100%;
            margin-bottom: 18px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #E3EDE8;
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #32D583, #1B8C5E);
            border-radius: 12px;
            transition: width 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .progress-label {
            color: #1B8C5E;
            letter-spacing: 0.8px;
        }

        .terminal {
            background: #F5FCF8;
            border-radius: 20px;
            padding: 14px 18px;
            border: 1px solid #DCEDE5;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            max-height: 110px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .log-line {
            color: #2A5241;
            padding: 4px 0;
            border-bottom: 1px solid #D9ECE3;
            font-size: 9px;
        }

        .log-line.success { color: #117F54; }
        .log-line.warning { color: #CD8B37; }
        .log-line.error { color: #D95C5C; }

        /* CHANNELS GRID – ELEGANT & CLEAN */
        .channels-container {
            display: none;
            animation: fadeSlideUp 0.4s ease;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 1.2px;
            color: #2F755C;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .channel-tile {
            background: #FFFFFF;
            border: 1.5px solid #E2EFE9;
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .channel-tile.joined {
            background: #F0FBF5;
            border-color: #9BDFC2;
        }

        .channel-tile.joining {
            opacity: 0.7;
            pointer-events: none;
        }

        .tile-icon {
            width: 48px;
            height: 48px;
            background: #F5FCF8;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .tile-icon svg {
            width: 24px;
            height: 24px;
            stroke: #1B8C5E;
            stroke-width: 1.6;
        }

        .channel-name {
            font-weight: 700;
            font-size: 13px;
            color: #1C3A2E;
            margin-bottom: 5px;
        }

        .channel-status-text {
            font-size: 9px;
            font-weight: 600;
            color: #98B2A7;
            text-transform: uppercase;
        }

        .channel-tile.joined .channel-status-text {
            color: #1B8C5E;
        }

        .check-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            background: #32D583;
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .channel-tile.joined .check-icon {
            display: flex;
        }

        .check-icon svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
        }

        .join-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #C4E6D7;
            border-top-color: #1B8C5E;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 6px;
        }

        .verify-btn {
            width: 100%;
            background: #158C60;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 14px rgba(21, 140, 96, 0.2);
        }

        .verify-btn:active {
            transform: scale(0.97);
            background: #117153;
        }

        .verify-btn:disabled {
            opacity: 0.6;
            transform: none;
        }

        .success-screen, .error-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .success-circle {
            width: 84px;
            height: 84px;
            background: #E0F4EA;
            border-radius: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .success-circle svg {
            width: 44px;
            height: 44px;
            stroke: #158C60;
        }

        .toast-notify {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #1E2F28;
            backdrop-filter: blur(16px);
            color: white;
            padding: 12px 24px;
            border-radius: 44px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.25s ease;
            white-space: nowrap;
            max-width: 85vw;
            white-space: normal;
            text-align: center;
        }

        .toast-notify.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-notify.success { background: #158C60; }
        .toast-notify.error { background: #D95C5C; }

        .hide { display: none; }
    </style>
</head>
<body>

<div class="tg-overlay" id="tgOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFFFFF;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;">
    <div style="width:72px;height:72px;background:#E6F7EF;border-radius:40px;display:flex;align-items:center;justify-content:center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#158C60" stroke-width="1.5"><path d="M21.41 3.58L2.39 11.17c-1.28.52-1.27 1.24-.23 1.56l4.85 1.51 11.23-7.07c.53-.32 1.01-.15.61.21l-9.1 8.21-.35 5.1c.51 0 .73-.23 1.01-.5l2.43-2.35 5.05 3.72c.93.51 1.6.25 1.83-.86l3.32-15.63c.34-1.37-.52-1.99-1.68-1.52z"/></svg>
    </div>
    <div style="font-weight:800;font-size:22px;color:#1C3A2E;">Joy Rummy</div>
    <div style="font-size:14px;color:#7C8F87;max-width:260px;">Open from Telegram Mini App to verify channels</div>
</div>

<div class="verification-card" id="appRoot" style="display:none;">
    <div class="profile-header">
        <div class="profile-left">
            <div class="avatar" id="avatarElem">
                <svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.6"/></svg>
            </div>
            <div class="user-info">
                <h3 id="displayName">Player</h3>
                <p id="displayId">TG ID: —</p>
            </div>
        </div>
        <div class="status-badge" id="globalBadge">● VERIFY</div>
    </div>
    <div class="content">
        <!-- SCANNING PANEL -->
        <div id="scanPanel">
            <div class="scan-state">
                <div class="pulse-ring"><div class="scan-spinner"></div></div>
                <div class="scan-title" id="scanTitle">Joy Gateway</div>
                <div class="scan-desc" id="scanDesc">Establishing secure handshake...</div>
                <div class="progress-area">
                    <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-stats"><span class="progress-label" id="progressLabel">INIT</span><span id="progressPercent">0%</span></div>
                </div>
                <div class="terminal" id="logPanel"><div class="log-line">> Booting secure environment...</div></div>
            </div>
        </div>

        <!-- SUCCESS PANEL -->
        <div id="successPanel" style="display: none;">
            <div class="success-screen">
                <div class="success-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="scan-title" style="color:#158C60;">Verified ✓</div>
                <div class="scan-desc" style="margin-bottom:24px;">All channels joined · Full access</div>
                <button class="verify-btn" id="enterAppBtn">🎮 ENTER JOY RUMMY</button>
            </div>
        </div>

        <!-- ERROR PANEL -->
        <div id="errorPanel" style="display: none;">
            <div class="success-screen">
                <div style="width:70px;height:70px;background:#FDE7E7;border-radius:40px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D95C5C"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <div class="scan-title" style="color:#D95C5C;">Access Denied</div>
                <div class="scan-desc" id="errorMsgText">Please restart from Joy Rummy bot</div>
            </div>
        </div>

        <!-- CHANNELS (11) ELEGANT LIST -->
        <div id="channelsPanel" style="display: none;">
            <div class="channels-container">
                <div class="section-title">✦ VERIFY 11 CHANNELS ✦</div>
                <div class="channels-grid" id="channelsGrid"></div>
                <button class="verify-btn" id="verifyAllBtn">✓ VERIFY ALL & UNLOCK</button>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify"></div>

<script>
    (function(){
        const tg = window.Telegram?.WebApp;
        const isTelegram = !!(tg && tg.initDataUnsafe);
        const overlay = document.getElementById('tgOverlay');
        const appRoot = document.getElementById('appRoot');

        if(!isTelegram){
            overlay.style.display = 'flex';
            appRoot.style.display = 'none';
            return;
        }

        overlay.style.display = 'none';
        appRoot.style.display = 'block';
        tg.ready();
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user || null;
        const chatId = tgUser?.id || null;

        // 11 channels (clean & green)
        const CHANNELS = [
            { id: 'ch1', name: 'Anmol Looter', url: 'https://t.me/+ujBbqNUUcvc2MTQ1', joined: false, joining: false },
            { id: 'ch2', name: 'Techno Earner', url: 'https://t.me/+M4yNsE8Vn8VjMmFl', joined: false, joining: false },
            { id: 'ch3', name: 'Op Looter', url: 'https://t.me/+Hd3qGhMs418wYzU1', joined: false, joining: false },
            { id: 'ch4', name: 'Singh Loots', url: 'https://t.me/+EWRTrM6TfbQ4Y2Nl', joined: false, joining: false },
            { id: 'ch5', name: 'All Yono Codes', url: 'https://t.me/+WpHJg0u2AfgyZTg1', joined: false, joining: false },
            { id: 'ch6', name: 'Earn Cash Tips', url: 'https://t.me/+zZnpAQ94w0hlOTk1', joined: false, joining: false },
            { id: 'ch7', name: 'All Yono Pr0mo', url: 'https://t.me/+pEa1guoClwY0M2E1', joined: false, joining: false },
            { id: 'ch8', name: 'All Earn Official', url: 'https://t.me/+oMFiGqZMushlNjVl', joined: false, joining: false },
            { id: 'ch9', name: 'Technical Aritra', url: 'https://t.me/+7ezw79py4AZkM2U1', joined: false, joining: false },
            { id: 'ch10', name: 'Yono Promocodes', url: 'https://t.me/+abKTdzwBGRQ0ZWU1', joined: false, joining: false },
            { id: 'ch11', name: 'Earning Market', url: 'https://t.me/+OYJmpBsT08NmODNl', joined: false, joining: false }
        ];

        // DOM elements
        const scanDiv = document.getElementById('scanPanel');
        const successDiv = document.getElementById('successPanel');
        const errorDiv = document.getElementById('errorPanel');
        const channelsDiv = document.getElementById('channelsPanel');
        const badgeSpan = document.getElementById('globalBadge');
        const userNameSpan = document.getElementById('displayName');
        const userIdSpan = document.getElementById('displayId');
        const progressFill = document.getElementById('progressFill');
        const progressLabelSpan = document.getElementById('progressLabel');
        const progressPercentSpan = document.getElementById('progressPercent');
        const logContainer = document.getElementById('logPanel');
        const scanTitleSpan = document.getElementById('scanTitle');
        const scanDescSpan = document.getElementById('scanDesc');
        const channelsGrid = document.getElementById('channelsGrid');
        const verifyBtn = document.getElementById('verifyAllBtn');
        const enterAppBtn = document.getElementById('enterAppBtn');

        let autoJoinTimer = null;

        function addLog(msg, type=''){
            const logDiv = document.createElement('div');
            logDiv.className = 'log-line';
            if(type) logDiv.classList.add(type);
            logDiv.textContent = `> ${msg}`;
            logContainer.appendChild(logDiv);
            logContainer.scrollTop = logContainer.scrollHeight;
            while(logContainer.children.length > 12) logContainer.removeChild(logContainer.firstChild);
        }

        function updateProgress(percent, label){
            progressFill.style.width = percent + '%';
            progressPercentSpan.innerText = percent + '%';
            if(label) progressLabelSpan.innerText = label;
        }

        function toastMessage(msg, type=''){
            const t = document.getElementById('toastMsg');
            t.innerText = msg;
            t.className = 'toast-notify show';
            if(type === 'success') t.classList.add('success');
            if(type === 'error') t.classList.add('error');
            setTimeout(() => {
                t.classList.remove('show');
                t.className = 'toast-notify';
            }, 2600);
        }

        function setBadgeStyle(state, text){
            badgeSpan.className = 'status-badge';
            badgeSpan.innerText = text;
            if(state === 'pending') badgeSpan.style.background = '#FFF2E0';
            else if(state === 'active') badgeSpan.style.background = '#E0F4EA';
            else badgeSpan.style.background = '#EFFAF5';
        }

        // Auto-join after 2.3 sec
        function markChannelJoined(channelId){
            const ch = CHANNELS.find(c => c.id === channelId);
            if(ch && !ch.joined){
                ch.joined = true;
                ch.joining = false;
                renderChannelsGrid();
                addLog(`✓ ${ch.name} verified automatically`, 'success');
                toastMessage(`✅ Joined ${ch.name}`, 'success');
                if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                
                const allJoined = CHANNELS.every(c => c.joined);
                if(allJoined){
                    addLog(`All 11 channels joined! Click verify.`, 'success');
                    toastMessage(`All channels ready! Tap Verify`, 'success');
                }
            }
        }

        function startJoiningProcess(channelId){
            const channel = CHANNELS.find(c => c.id === channelId);
            if(!channel || channel.joined || channel.joining) return;
            channel.joining = true;
            renderChannelsGrid();
            if(autoJoinTimer) clearTimeout(autoJoinTimer);
            autoJoinTimer = setTimeout(() => {
                markChannelJoined(channelId);
                autoJoinTimer = null;
            }, 2300);
        }

        function renderChannelsGrid(){
            channelsGrid.innerHTML = CHANNELS.map(ch => `
                <div class="channel-tile ${ch.joined ? 'joined' : ''} ${ch.joining ? 'joining' : ''}" data-id="${ch.id}" data-url="${ch.url}">
                    <div class="check-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white"><polyline points="20 6 9 17 4 12"/></svg></div>
                    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.41 3.58L2.39 11.17c-1.28.52-1.27 1.24-.23 1.56l4.85 1.51 11.23-7.07c.53-.32 1.01-.15.61.21l-9.1 8.21-.35 5.1c.51 0 .73-.23 1.01-.5l2.43-2.35 5.05 3.72c.93.51 1.6.25 1.83-.86l3.32-15.63c.34-1.37-.52-1.99-1.68-1.52z"/></svg></div>
                    <div class="channel-name">${ch.name}</div>
                    <div class="channel-status-text">${ch.joined ? '✓ VERIFIED' : (ch.joining ? 'JOINING...' : '⚡ TAP TO JOIN')}</div>
                </div>
            `).join('');

            document.querySelectorAll('.channel-tile').forEach(tile => {
                const id = tile.dataset.id;
                const url = tile.dataset.url;
                const channel = CHANNELS.find(c => c.id === id);
                if(!channel) return;
                tile.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(channel.joined){
                        toastMessage(`${channel.name} already verified`, 'success');
                        return;
                    }
                    if(channel.joining){
                        toastMessage(`Already joining ${channel.name}...`, '');
                        return;
                    }
                    if(url){
                        if(tg?.openTelegramLink) tg.openTelegramLink(url);
                        else window.open(url, '_blank');
                        toastMessage(`Opening ${channel.name}...`, '');
                        addLog(`Opened ${channel.name} — auto-verify in ~2 sec`, 'warning');
                        startJoiningProcess(id);
                    } else {
                        toastMessage(`No link for ${channel.name}`, 'error');
                    }
                });
            });
        }

        async function finalVerification(){
            if(verifyBtn.disabled) return;
            verifyBtn.disabled = true;
            const originalText = verifyBtn.innerHTML;
            verifyBtn.innerHTML = `<span style="width:18px;height:18px;border:2px solid white;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin 0.6s linear infinite;"></span> VERIFYING...`;
            addLog(`Checking membership status...`, '');
            await new Promise(r => setTimeout(r, 650));
            const allJoined = CHANNELS.every(ch => ch.joined);
            if(allJoined){
                addLog(`✓ Access granted — 11/11 channels`, 'success');
                toastMessage(`Verification successful!`, 'success');
                if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                setBadgeStyle('active', '✓ ACCESS');
                channelsDiv.style.display = 'none';
                successDiv.style.display = 'block';
            } else {
                const missingList = CHANNELS.filter(ch => !ch.joined).map(ch => ch.name);
                addLog(`❌ Missing ${missingList.length} channels: ${missingList.slice(0,5).join(', ')}`, 'error');
                toastMessage(`Tap each channel to join (auto-verifies)`, 'error');
                if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = originalText;
            }
        }

        async function startInitialFlow(){
            updateProgress(8, 'CONNECT');
            addLog(`Initiating secure gateway...`);
            await new Promise(r => setTimeout(r, 320));
            if(!chatId){
                addLog(`Missing Telegram context`, 'error');
                showErrorPanel('Please restart from Joy Rummy bot');
                return;
            }
            updateProgress(32, 'AUTH');
            scanTitleSpan.innerText = 'Identity Confirmed';
            scanDescSpan.innerText = `Welcome ${tgUser?.first_name || 'Player'} ✦`;
            addLog(`User ID ${chatId} verified`, 'success');
            await new Promise(r => setTimeout(r, 420));
            updateProgress(64, 'CHANNELS');
            scanTitleSpan.innerText = 'Channel Sync';
            addLog(`Fetching 11 official channels...`, 'warning');
            await new Promise(r => setTimeout(r, 460));
            updateProgress(92, 'READY');
            addLog(`Ready: tap any channel → join → auto-verified after 2-3 sec`, 'warning');
            await new Promise(r => setTimeout(r, 380));
            updateProgress(100, 'DONE');
            scanDiv.style.display = 'none';
            channelsDiv.style.display = 'block';
            setBadgeStyle('pending', '⚠️ 11 CHANNELS');
            renderChannelsGrid();
        }

        function showErrorPanel(msg){
            scanDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            document.getElementById('errorMsgText').innerText = msg;
            setBadgeStyle('scan', 'BLOCKED');
        }

        function launchMiniApp(){
            if(tg) tg.close();
            toastMessage(`Launching Joy Rummy...`, 'success');
            setTimeout(() => { window.location.href = '../miniapp/'; }, 350);
        }

        if(tgUser){
            const fullName = ((tgUser.first_name || '') + (tgUser.last_name ? ' ' + tgUser.last_name : '')).trim();
            userNameSpan.innerText = fullName || 'Joy Player';
            userIdSpan.innerText = `TG ID: ${tgUser.id}`;
            if(tgUser.photo_url){
                document.getElementById('avatarElem').innerHTML = `<img src="${tgUser.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:32px;">`;
            }
        }

        verifyBtn.onclick = finalVerification;
        enterAppBtn.onclick = launchMiniApp;
        startInitialFlow().catch(e => { console.warn(e); showErrorPanel('Verification error. Refresh.'); });
    })();
</script>
</body>
                  </html>
